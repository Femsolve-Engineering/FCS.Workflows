name: Publish NPM Package

on:
  workflow_call:
    inputs:
      releaseVersion:
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install pre-requisites
        run: npm install

      - name: Build viewer bundle and extract declaration files
        run: npm run build:eprod

      - name: Zip viewer bundle assets
        run: |
          zip -r fcs-core-editor.zip ./fcs-core-editor

      - name: Attach bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.releaseVersion }}
          files: ./fcs-core-editor.zip

      - name: Publish declaration files
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          npm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
